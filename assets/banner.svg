<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="HuntPilot banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f1e3a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.5"/>
  <!-- logo mark -->
  <g transform="translate(96,64)">
    <circle cx="96" cy="96" r="62" fill="none" stroke="#1f2937" stroke-width="8"/>
    <circle cx="96" cy="96" r="38" fill="none" stroke="#334155" stroke-width="6"/>
    <circle cx="96" cy="96" r="18" fill="url(#acc)"/>
    <line x1="96" y1="10" x2="96" y2="38" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
    <line x1="96" y1="154" x2="96" y2="182" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
    <line x1="10" y1="96" x2="38" y2="96" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
    <line x1="154" y1="96" x2="182" y2="96" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- wordmark -->
  <text x="320" y="150" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="700" fill="#f8fafc">Hunt<tspan fill="url(#acc)">Pilot</tspan></text>
  <text x="324" y="200" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">Referral-first job search copilot</text>
  <text x="324" y="240" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="400" fill="#64748b">Templates · Fit scoring · Tracker · Copilot Studio · Claude Projects · Custom GPT</text>
</svg>